{{define "header"}}<header class="__P__-header">
<div class="__P__-wrap __P__-header__inner">
<a class="__P__-brand" href="/" aria-label="{{.Site.Name}}, home">{{if .Site.LogoURL}}<img src="{{imgsrc .Site.LogoURL}}" alt="{{.Site.Name}}" height="28">{{else}}<span class="__P__-brand__name">{{.Site.Name}}</span>{{end}}</a>
{{if .Site.Nav}}<nav class="__P__-nav" aria-label="Primary">{{range .Site.Nav}}{{template "nav-link" dict "Item" . "Path" $.Path}}{{end}}</nav>
{{end}}<div class="__P__-header__end">
<button type="button" class="__P__-mode" data-hm-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" hidden><svg class="__P__-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="__P__-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
{{with .Site.HeaderCTA}}<a class="hm-btn __P__-header__cta" href="{{cta .URL}}">{{.Label}}</a>
{{end}}</div>
</div>
</header>{{end}}
