{{define "header"}}<header class="hn-header">
<div class="hn-wrap hn-header__inner">
<a class="hn-brand" href="/" aria-label="{{.Site.Name}}, home">{{if .Site.LogoURL}}<img src="{{imgsrc .Site.LogoURL}}" alt="{{.Site.Name}}" height="28">{{else}}<span class="hn-brand__name">{{.Site.Name}}</span>{{end}}</a>
{{if .Site.Nav}}<nav class="hn-nav" aria-label="Primary">{{range .Site.Nav}}{{template "nav-link" dict "Item" . "Path" $.Path}}{{end}}</nav>
{{end}}<div class="hn-header__end">
{{with .Site.HeaderCTA}}<a class="hm-btn hn-header__cta" href="{{cta .URL}}">{{.Label}}</a>
{{end}}</div>
</div>
</header>{{end}}
