{{define "section-cta"}}{{$c := .Content}}{{$photo := ""}}{{with $c.backgroundImage}}{{$photo = imgsrc .}}{{end}}
<div class="hm-container hm-cta hm-cta--{{default "plain" $c.backgroundStyle}}{{if $photo}} hm-cta--has-photo{{end}}">
  {{if $photo}}<img class="ht-band__img" src="{{$photo}}" alt="" decoding="async">{{end}}
  {{with $c.eyebrow}}<p class="hm-cta__eyebrow" {{hmf "eyebrow"}}>{{.}}</p>{{end}}
  <h2 class="hm-cta__headline" {{hmf "headline"}}>{{$c.headline}}</h2>
  {{with $c.subheadline}}<div class="hm-cta__subheadline" {{hmf "subheadline"}} data-hm-kind="richtext">{{.}}</div>{{end}}
  {{with $c.buttonText}}<p class="hm-cta__actions"><a class="hm-btn" href="{{cta $c.buttonUrl}}" {{hmf "buttonText"}}>{{.}}</a></p>{{end}}
</div>
{{end}}
