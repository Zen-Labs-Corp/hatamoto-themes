{{define "sumi-css"}}<style>
/* tokens */
:root{--paper:#fafaf7;--ink:#1b1b19;--mute:#6b6a64;--rule:#e4e2da;--code:#f1efe8;--ok:#5d7a3a;--accent:var(--hm-primary,#b8432f);--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--measure:38rem;--radius:var(--hm-radius-sm,4px);--sp-1:.25rem;--sp-2:.5rem;--sp-3:1rem;--sp-4:1.5rem;--sp-5:2.5rem}
/* DARK-SLOT */
/* base */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{margin:0;background:var(--hm-bg,var(--paper));color:var(--hm-text,var(--ink));font:17px/1.65 var(--hm-font,var(--sans))}
a{color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
a[aria-current=page]{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img,video,iframe,svg{max-width:100%;height:auto}
pre{overflow:auto}
p,li,td,h1,h2,h3{overflow-wrap:anywhere}
.hm-skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:var(--sp-2) var(--sp-3);z-index:9}
.hm-skip:focus{left:.5rem;top:.5rem}
.hm-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
/* shell */
.sumi-wrap,main{display:block;width:min(var(--measure),100% - 2.5rem);margin:0 auto}
.sumi-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:var(--sp-1) var(--sp-3);padding-top:var(--sp-4);padding-bottom:.75rem;border-bottom:1px solid var(--rule);font-size:.9rem}
.sumi-brand{color:var(--ink);font-weight:600;letter-spacing:.02em;text-decoration:none}
.sumi-dot{color:var(--accent)}
.sumi-nav a{color:var(--mute);text-decoration:none;margin-left:1.1rem}
.sumi-nav a:first-child{margin-left:0}
.sumi-nav a:hover,.sumi-nav a[aria-current]{color:var(--ink)}
.sumi-footer{margin-top:3rem;margin-bottom:var(--sp-5);padding-top:var(--sp-3);border-top:1px solid var(--rule);font:.78rem/1.8 var(--mono);color:var(--mute)}
.sumi-footer p{margin:0}
.sumi-footnav a{color:var(--mute);margin-right:var(--sp-3)}
.sumi-theme b{color:var(--ink);font-weight:500}
.sumi-ok{color:var(--ok)}
/* type */
h1{font-size:1.9rem;line-height:1.2;letter-spacing:-.015em;margin:var(--sp-5) 0 .4rem;font-weight:650;text-wrap:balance}
h2{font-size:1.15rem;margin:2.4rem 0 .4rem;font-weight:650}
h3{font-size:1rem;margin:1.8rem 0 .3rem;font-weight:650}
p,ul,ol{margin:0 0 1.15rem}
li{margin:.2rem 0}
.sumi-meta{color:var(--mute);font:.85rem/1.6 var(--mono);margin:0 0 2rem}
.sumi-meta a{color:var(--mute)}
/* rows (home, archive, taxonomy, author, search) */
.sumi-lede{font-size:1.25rem;line-height:1.45;font-weight:400;letter-spacing:0;margin:var(--sp-5) 0 .4rem}
.sumi-sec{font:600 .8rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:2.4rem 0 .6rem}
.sumi-rows{list-style:none;padding:0;margin:0}
.sumi-row{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:.1rem 1rem;margin:0;padding:.8rem 0;border-bottom:1px solid var(--rule)}
.sumi-date{font:.82rem var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.sumi-t{color:var(--ink);text-decoration:none}
.sumi-t:hover{color:var(--accent);text-decoration:underline}
.sumi-cat{font:.78rem var(--mono);color:var(--mute)}
.sumi-x{grid-column:2/4;margin:0;color:var(--mute);font-size:.92rem;line-height:1.5}
.sumi-more{font-size:.9rem;margin-top:1.2rem}
@media (max-width:600px){.sumi-cat{display:none}.sumi-x{grid-column:1/4}}
/* post and page */
.sumi-prose,.hm-prose{overflow-wrap:anywhere}
.sumi-prose a,.hm-prose a{color:var(--accent)}
.sumi-prose>:last-child{margin-bottom:0}
.sumi-prose h2,.hm-prose h2{margin-top:2.4rem}
.sumi-prose ul,.sumi-prose ol,.hm-prose ul,.hm-prose ol{padding-left:1.4rem}
.sumi-prose code,.hm-prose code{font:.86em var(--mono);background:var(--code);padding:.1em .3em;border-radius:3px}
.sumi-prose pre,.hm-prose pre{font:.84rem/1.55 var(--mono);background:var(--code);padding:1rem 1.1rem;border-radius:var(--radius);margin:0 0 1.4rem}
.sumi-prose pre code,.hm-prose pre code{background:none;padding:0;font-size:inherit}
.sumi-prose blockquote,.hm-prose blockquote{margin:0 0 1.2rem;padding-left:1rem;border-left:2px solid var(--accent);color:var(--mute)}
.sumi-prose table,.hm-prose table{border-collapse:collapse;width:100%;font-size:.88rem;margin:0 0 1.4rem;font-variant-numeric:tabular-nums}
.sumi-prose th,.sumi-prose td,.hm-prose th,.hm-prose td{text-align:left;padding:.35rem .6rem .35rem 0;border-bottom:1px solid var(--rule)}
.sumi-prose th,.hm-prose th{font-weight:600;color:var(--mute)}
.sumi-prose td+td,.sumi-prose th+th,.hm-prose td+td,.hm-prose th+th{text-align:right}
.sumi-prose figure,.hm-prose figure,.sumi-post figure{margin:0 0 1.6rem}
.sumi-prose figcaption,.hm-prose figcaption{font:.78rem var(--mono);color:var(--mute);margin-top:.4rem}
.sumi-prose .alignwide,.sumi-prose .alignfull,.hm-prose .alignwide,.hm-prose .alignfull{width:auto;max-width:100%;margin-left:0;margin-right:0}
hr{border:0;border-top:1px solid var(--rule);margin:2.5rem 0}
.sumi-img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--radius)}
.sumi-lite .sumi-row{padding:.4rem 0}
.sumi-next{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin:var(--sp-5) 0 0;font-size:.92rem}
.sumi-next span{display:block;font:.75rem var(--mono);color:var(--mute)}
.sumi-next a:last-child{text-align:right}
/* archive, pagination */
.sumi-empty{color:var(--mute)}
.hm-pagination ul{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--sp-2) var(--sp-3);list-style:none;margin:2rem 0 0;padding:0;font:.85rem var(--mono)}
.hm-pagination li{margin:0}
.hm-pagination a[aria-current=page]{color:var(--ink);text-decoration:none;font-weight:600}
</style>{{end}}
